<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Appliance Error Codes &amp; Troubleshooting</title>
<meta name="description" content="This page does not exist. Search for your appliance error code from the homepage.">
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1e293b;max-width:640px;margin:4rem auto;padding:0 1.25rem;line-height:1.65}
h1{color:#0f172a}a{color:#1d4ed8}
</style>
</head>
<body>
<h1>Page not found</h1>
<p>Sorry — the page you asked for does not exist, or it moved. Error-code meanings vary by brand and model, so the fastest fix is usually a fresh search.</p>
<p><a id="home-link" href="index.html">Go to the homepage and search your error code</a></p>
<script>
(function () {
  // GitHub Pages serves this file at the requested (missing) URL, so a plain
  // relative link would resolve inside the missing path. Point home at the
  // site root instead: for project pages that is /<repo>/, otherwise /.
  try {
    var parts = location.pathname.split('/').filter(Boolean);
    var root = parts.length > 0 ? '/' + parts[0] + '/' : '/';
    var link = document.getElementById('home-link');
    if (location.protocol !== 'file:') link.setAttribute('href', root + 'index.html');
  } catch (e) { /* keep the relative link */ }
})();
</script>
</body>
</html>
